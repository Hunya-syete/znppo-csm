<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNP Zamboanga del Norte PPO QR Feedback & Management System</title>
    <script>
      // Completely silence Vite HMR WebSocket messages and connection attempts in sandboxed dev environment
      (function() {
        // Suppress all [vite] and WebSocket log messages from console output
        ['log', 'info', 'debug', 'warn', 'error'].forEach(function(method) {
          var original = console[method];
          if (original) {
            console[method] = function() {
              var firstArg = arguments[0];
              if (typeof firstArg === 'string' && (firstArg.includes('[vite]') || firstArg.includes('WebSocket'))) {
                return;
              }
              return original.apply(console, arguments);
            };
          }
        });

        // Intercept Vite WebSocket instantiation and mock an open connection so Vite does not loop/retry
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr'))) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {},
                readyState: 1 // Simulated OPEN state to keep Vite quiet
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        // Global protection against any unhandled Vite or WebSocket rejections/errors
        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String((event && event.reason) || '');
          var msgStr = String((event && event.reason && event.reason.message) || '');
          if (reasonStr.includes('WebSocket') || reasonStr.includes('vite') || msgStr.includes('WebSocket') || msgStr.includes('vite')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msgStr = String((event && event.message) || '');
          if (msgStr.includes('WebSocket') || msgStr.includes('vite')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
